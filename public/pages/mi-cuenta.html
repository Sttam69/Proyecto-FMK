<!-- SECCIÓN: MI CUENTA -->
<div id="seccion-mi-cuenta">

  <div style="max-width:560px;">

    <div class="card">
      <div class="card-header">
        <h3>👤 Información de mi cuenta</h3>
      </div>
      <div class="card-body">
        <div id="msg-cuenta"></div>

        <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">
          <div style="position:relative;flex-shrink:0;">
            <div id="avatar-grande" style="width:72px;height:72px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;overflow:hidden;">?</div>
            <label for="input-avatar" style="position:absolute;bottom:0;right:0;width:24px;height:24px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff;" title="Cambiar foto">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
            </label>
            <input type="file" id="input-avatar" accept="image/jpeg,image/png" style="display:none;" onchange="subirAvatar(this)" />
          </div>
          <div>
            <div id="cuenta-nombre" style="font-size:18px;font-weight:700;"></div>
            <div id="cuenta-rol"    style="font-size:13px;color:#6b7280;margin-top:2px;"></div>
            <div id="cuenta-club"   style="font-size:13px;color:#6b7280;"></div>
          </div>
        </div>

        <div class="form-group">
          <label>Nombre completo</label>
          <input type="text" id="editar-nombre" placeholder="Tu nombre completo" />
        </div>

        <button class="btn btn-primary" onclick="guardarNombre()">Guardar cambios</button>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-header">
        <h3>🔑 Cambiar contraseña</h3>
      </div>
      <div class="card-body">
        <div id="msg-password"></div>
        <div class="form-group">
          <label>Nueva contraseña</label>
          <input type="password" id="nueva-password" placeholder="Mínimo 8 caracteres" />
        </div>
        <div class="form-group">
          <label>Repetir nueva contraseña</label>
          <input type="password" id="repetir-password" placeholder="Repite la contraseña" />
        </div>
        <button class="btn btn-primary" onclick="cambiarPassword()">Cambiar contraseña</button>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-header">
        <h3>🚪 Cerrar sesión</h3>
      </div>
      <div class="card-body">
        <p style="font-size:13.5px;color:#6b7280;margin-bottom:12px;">
          Cierra tu sesión actual. Tendrás que volver a introducir tus credenciales para acceder.
        </p>
        <button class="btn btn-danger" onclick="if(confirm('¿Seguro que quieres cerrar sesión?')) logout()">
          Cerrar sesión
        </button>
      </div>
    </div>

  </div>
</div>
