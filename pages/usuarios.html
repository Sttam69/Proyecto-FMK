<!-- SECCIÓN: GESTIÓN DE USUARIOS (solo Administrador) -->
<div id="seccion-usuarios">

  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-usuarios" placeholder="Buscar por nombre o correo..." oninput="filtrarUsuarios()" />
    </div>
    <button class="btn btn-primary" onclick="abrirModalUsuario()">+ Nuevo usuario</button>
  </div>

  <div class="card">
    <div class="card-header">
      <h3>👥 Usuarios del sistema</h3>
      <span id="usuarios-count" style="font-size:13px;color:#6b7280;"></span>
    </div>
    <table class="data-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Correo electrónico</th>
          <th>Rol</th>
          <th>Club</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-usuarios">
        <tr><td colspan="6" class="loading-spinner"><div class="spinner"></div><span>Cargando...</span></td></tr>
      </tbody>
    </table>
  </div>

  <!-- MODAL: CREAR / EDITAR USUARIO -->
  <div class="modal-overlay hidden" id="modal-usuario">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-usuario-titulo">Nuevo usuario</h3>
        <button class="modal-close" onclick="cerrarModalUsuario()">✕</button>
      </div>
      <div class="modal-body">
        <div id="msg-usuario"></div>
        <div class="form-group">
          <label>Nombre completo *</label>
          <input type="text" id="usr-nombre" placeholder="Ej: Juan García López" />
        </div>
        <div class="form-group">
          <label>Correo electrónico *</label>
          <input type="email" id="usr-email" placeholder="correo@ejemplo.com" />
        </div>
        <div class="form-group" id="campo-password">
          <label>Contraseña temporal *</label>
          <input type="password" id="usr-password" placeholder="Mínimo 8 caracteres" />
          <small style="color:#6b7280;font-size:12px;">El usuario deberá cambiarla en su primer inicio de sesión.</small>
        </div>
        <div class="form-group">
          <label>Rol *</label>
          <select id="usr-rol" onchange="toggleCampoClub()">
            <option value="">— Seleccionar rol —</option>
            <option value="admin">Administrador</option>
            <option value="juez">Juez de Tribunal</option>
            <option value="representante">Representante de Club</option>
            <option value="aspirante">Aspirante</option>
          </select>
        </div>
        <div class="form-group" id="campo-club" style="display:none;">
          <label>Club *</label>
          <select id="usr-club">
            <option value="">— Seleccionar club —</option>
          </select>
        </div>
        <div class="form-group" id="campo-activo" style="display:none;">
          <label>
            <input type="checkbox" id="usr-activo" checked />
            Cuenta activa
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModalUsuario()">Cancelar</button>
        <button class="btn btn-primary" id="btn-guardar-usuario" onclick="guardarUsuario()">Guardar</button>
      </div>
    </div>
  </div>

</div>

<script type="module">
  import { supabase } from '../js/supabase-client.js';
  import { textoRol, badgeEstado, mostrarError, mostrarExito } from '../js/utils.js';

  let todosUsuarios = [];
  let editandoId = null;
  let clubs = [];

  window.init_usuarios = async function() {
    await Promise.all([cargarClubs(), cargarUsuarios()]);
  };

  async function cargarClubs() {
    const { data } = await supabase.from('clubs').select('id, name').order('name');
    clubs = data ?? [];
    const select = document.getElementById('usr-club');
    clubs.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name;
      select.appendChild(opt);
    });
  }

  async function cargarUsuarios() {
    const tbody = document.getElementById('tabla-usuarios');
    try {
      const { data, error } = await supabase
        .from('profiles')
        .select('*, clubs(name)')
        .order('full_name');
      if (error) throw error;
      todosUsuarios = data ?? [];
      renderizarUsuarios(todosUsuarios);
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#dc2626;">Error al cargar usuarios.</td></tr>`;
    }
  }

  function renderizarUsuarios(lista) {
    const tbody = document.getElementById('tabla-usuarios');
    const count = document.getElementById('usuarios-count');
    count.textContent = `${lista.length} usuario${lista.length !== 1 ? 's' : ''}`;

    if (lista.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">👥</div><p>No hay usuarios para mostrar.</p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = lista.map(u => `
      <tr>
        <td><strong>${u.full_name}</strong></td>
        <td style="color:#6b7280;">${u.id}</td>
        <td>${textoRol(u.role)}</td>
        <td>${u.clubs?.name ?? '—'}</td>
        <td>${u.is_active
          ? '<span class="badge badge-green">Activo</span>'
          : '<span class="badge badge-red">Inactivo</span>'}</td>
        <td>
          <button class="btn btn-secondary btn-sm" onclick="editarUsuario('${u.id}')">Editar</button>
          <button class="btn btn-danger btn-sm" style="margin-left:4px;" onclick="toggleActivo('${u.id}', ${u.is_active})">
            ${u.is_active ? 'Desactivar' : 'Activar'}
          </button>
        </td>
      </tr>`).join('');
  }

  window.filtrarUsuarios = function() {
    const q = document.getElementById('search-usuarios').value.toLowerCase();
    const filtrado = todosUsuarios.filter(u =>
      u.full_name.toLowerCase().includes(q) || u.role.toLowerCase().includes(q)
    );
    renderizarUsuarios(filtrado);
  };

  window.abrirModalUsuario = function() {
    editandoId = null;
    document.getElementById('modal-usuario-titulo').textContent = 'Nuevo usuario';
    document.getElementById('usr-nombre').value = '';
    document.getElementById('usr-email').value = '';
    document.getElementById('usr-password').value = '';
    document.getElementById('usr-rol').value = '';
    document.getElementById('usr-club').value = '';
    document.getElementById('campo-club').style.display = 'none';
    document.getElementById('campo-password').style.display = 'block';
    document.getElementById('campo-activo').style.display = 'none';
    document.getElementById('msg-usuario').innerHTML = '';
    document.getElementById('modal-usuario').classList.remove('hidden');
  };

  window.editarUsuario = function(id) {
    const u = todosUsuarios.find(x => x.id === id);
    if (!u) return;
    editandoId = id;
    document.getElementById('modal-usuario-titulo').textContent = 'Editar usuario';
    document.getElementById('usr-nombre').value = u.full_name;
    document.getElementById('usr-email').value = '';
    document.getElementById('usr-rol').value = u.role;
    document.getElementById('usr-club').value = u.club_id ?? '';
    document.getElementById('campo-club').style.display = (u.role === 'representante' || u.role === 'aspirante') ? 'block' : 'none';
    document.getElementById('campo-password').style.display = 'none';
    document.getElementById('campo-activo').style.display = 'block';
    document.getElementById('usr-activo').checked = u.is_active;
    document.getElementById('msg-usuario').innerHTML = '';
    document.getElementById('modal-usuario').classList.remove('hidden');
  };

  window.cerrarModalUsuario = function() {
    document.getElementById('modal-usuario').classList.add('hidden');
  };

  window.toggleCampoClub = function() {
    const rol = document.getElementById('usr-rol').value;
    const mostrar = rol === 'representante' || rol === 'aspirante';
    document.getElementById('campo-club').style.display = mostrar ? 'block' : 'none';
  };

  window.guardarUsuario = async function() {
    const nombre   = document.getElementById('usr-nombre').value.trim();
    const email    = document.getElementById('usr-email').value.trim();
    const password = document.getElementById('usr-password').value;
    const rol      = document.getElementById('usr-rol').value;
    const clubId   = document.getElementById('usr-club').value || null;
    const activo   = document.getElementById('usr-activo').checked;

    if (!nombre || !rol) {
      mostrarError('msg-usuario', 'Los campos de nombre y rol son obligatorios.');
      return;
    }

    const btn = document.getElementById('btn-guardar-usuario');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    try {
      if (editandoId) {
        // Actualizar perfil existente
        const { error } = await supabase
          .from('profiles')
          .update({ full_name: nombre, role: rol, club_id: clubId, is_active: activo })
          .eq('id', editandoId);
        if (error) throw error;
        mostrarExito('msg-usuario', '✓ Usuario actualizado correctamente.');
      } else {
        // Crear nuevo usuario en Supabase Auth (requiere service_role en producción)
        // En el frontend solo podemos usar el Admin API con el service role key.
        // Por eso usamos la función admin de supabase.auth.admin.createUser
        // NOTA: Esta llamada necesita que el service role sea configurado en un Edge Function.
        // Por ahora mostramos las instrucciones al administrador.
        if (!email || !password) {
          mostrarError('msg-usuario', 'El correo y la contraseña son obligatorios para usuarios nuevos.');
          btn.disabled = false;
          btn.textContent = 'Guardar';
          return;
        }

        // Insertar usando la función RPC que llama al admin de auth
        const { error } = await supabase.rpc('create_user_by_admin', {
          p_email: email,
          p_password: password,
          p_full_name: nombre,
          p_role: rol,
          p_club_id: clubId
        });
        if (error) throw error;
        mostrarExito('msg-usuario', '✓ Usuario creado. El correo de bienvenida ha sido enviado.');
      }

      await cargarUsuarios();
    } catch (err) {
      mostrarError('msg-usuario', `Error: ${err.message}`);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar';
    }
  };

  window.toggleActivo = async function(id, estadoActual) {
    const accion = estadoActual ? 'desactivar' : 'activar';
    if (!confirm(`¿Seguro que quieres ${accion} este usuario?`)) return;
    const { error } = await supabase
      .from('profiles')
      .update({ is_active: !estadoActual })
      .eq('id', id);
    if (!error) await cargarUsuarios();
    else alert('No se pudo cambiar el estado del usuario.');
  };

  if (document.getElementById('seccion-usuarios')) window.init_usuarios();
</script>
