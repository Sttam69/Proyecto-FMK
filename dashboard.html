<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FMK – Panel de Gestión</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>
<body>

<div class="app-layout">

  <!-- =====================================================
       SIDEBAR IZQUIERDO
       ===================================================== -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
      <img src="/escudo-fmk.png" alt="Escudo Oficial FMK" class="logo-img-dashboard" />
      <div class="logo-text">
        <h2>FMK</h2>
        <span>Gestión de Exámenes</span>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- El menú se genera dinámicamente según el rol del usuario -->
    </nav>

  </aside>

  <!-- Overlay oscuro en móvil para cerrar el sidebar -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- =====================================================
       CONTENIDO PRINCIPAL
       ===================================================== -->
  <div class="main-content">

    <!-- Header superior -->
    <header class="top-header">
      <div class="header-left">
        <button class="hamburger-btn" id="hamburger-btn" title="Abrir menú">☰</button>
        <span class="page-title" id="page-title">Panel Principal</span>
      </div>
      <div class="header-right">
        <button class="theme-toggle" id="theme-toggle" title="Cambiar tema"></button>
        <div class="profile-dropdown" id="profile-dropdown">
          <button class="profile-trigger" id="profile-trigger">
            <div class="user-avatar" id="user-avatar">?</div>
            <div class="user-details">
              <div class="user-name" id="user-name">Cargando...</div>
              <div class="user-role" id="user-role"></div>
            </div>
            <span class="dropdown-caret">▾</span>
          </button>
          <div class="profile-menu hidden" id="profile-menu">
            <div class="profile-menu-item" onclick="navigateTo('mi-cuenta');closeProfileMenu()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Mi cuenta
            </div>
            <div class="profile-menu-divider"></div>
            <div class="profile-menu-item danger" onclick="logout()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Cerrar sesión
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Área de contenido central (aquí se cargan las secciones) -->
    <main class="content-area" id="content-area">
      <div class="loading-spinner">
        <div class="spinner"></div>
        <span>Cargando panel...</span>
      </div>
    </main>

  </div>
</div>

<script type="module">
  import { requireAuth, getCurrentProfile, logout, startActivityListeners } from '/src/auth.js';
  import { initRouter, navigateTo } from '/src/router.js';
  import { textoRol, obtenerIniciales } from '/src/utils.js';

  // Iconos SVG Lucide para el menú lateral
  const ICONS = {
    home:   `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
    shield: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
    clipbd: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>`,
    calend: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
    scale:  `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="21"/><path d="M5 21h14"/><path d="M3 6l9-3 9 3"/><path d="M3 6l3 9H0"/><path d="M21 6l3 9h-6"/></svg>`,
    trophy: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2h-2"/><rect x="6" y="18" width="12" height="4"/></svg>`,
    chart:  `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>`,
    users:  `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  }

  // Estructura completa del menú lateral con los roles que pueden verlo
  const MENU = [
    {
      seccion: 'Inicio',
      items: [
        { section: 'inicio', icon: ICONS.home, label: 'Panel Principal', roles: ['admin','juez','representante','aspirante'] },
      ]
    },
    {
      seccion: 'Deportistas',
      items: [
        { section: 'aspirantes', icon: ICONS.shield, label: 'Aspirantes', roles: ['admin','representante','aspirante'] },
      ]
    },
    {
      seccion: 'Exámenes',
      items: [
        { section: 'inscripciones',  icon: ICONS.clipbd, label: 'Inscripciones',   roles: ['admin','representante','aspirante'] },
        { section: 'examenes',       icon: ICONS.calend, label: 'Exámenes',         roles: ['admin','juez','representante','aspirante'] },
        { section: 'tribunales',     icon: ICONS.scale,  label: 'Tribunales',       roles: ['admin'] },
        { section: 'calificaciones', icon: ICONS.trophy, label: 'Calificaciones',   roles: ['admin','juez','aspirante'] },
      ]
    },
    {
      seccion: 'Informes',
      items: [
        { section: 'reportes', icon: ICONS.chart, label: 'Reportes y Actas', roles: ['admin','representante'] },
      ]
    },
    {
      seccion: 'Administración',
      items: [
        { section: 'usuarios', icon: ICONS.users, label: 'Gestión de Usuarios', roles: ['admin'] },
      ]
    },
  ];

  // Genera el HTML del sidebar según el rol del usuario
  function generarMenu(rol) {
    const nav = document.getElementById('sidebar-nav');
    let html = '';

    MENU.forEach(grupo => {
      const itemsVisibles = grupo.items.filter(item => item.roles.includes(rol));
      if (itemsVisibles.length === 0) return;

      html += `<div class="nav-section">
        <div class="nav-section-title">${grupo.seccion}</div>`;

      itemsVisibles.forEach(item => {
        html += `<div class="nav-item" data-section="${item.section}" onclick="navigateTo('${item.section}')">
          <span class="nav-icon">${item.icon}</span>
          <span>${item.label}</span>
        </div>`;
      });

      html += `</div>`;
    });

    nav.innerHTML = html;
  }

  // Exponer navigateTo y logout globalmente
  window.navigateTo = navigateTo
  window.logout = logout

  // --- DARK MODE ---
  const SVG_MOON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`
  const SVG_SUN  = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`

  const savedTheme = localStorage.getItem('fmk-theme')
  if (savedTheme === 'dark') document.documentElement.classList.add('dark')

  const themeBtn = document.getElementById('theme-toggle')
  themeBtn.innerHTML = document.documentElement.classList.contains('dark') ? SVG_SUN : SVG_MOON
  themeBtn.addEventListener('click', () => {
    const isDark = document.documentElement.classList.toggle('dark')
    localStorage.setItem('fmk-theme', isDark ? 'dark' : 'light')
    themeBtn.innerHTML = isDark ? SVG_SUN : SVG_MOON
  })

  // --- DROPDOWN DE PERFIL ---
  const profileTrigger   = document.getElementById('profile-trigger')
  const profileMenu      = document.getElementById('profile-menu')
  const profileDropdown  = document.getElementById('profile-dropdown')

  window.closeProfileMenu = function() {
    profileMenu.classList.add('hidden')
    profileDropdown.classList.remove('open')
  }

  profileTrigger.addEventListener('click', (e) => {
    e.stopPropagation()
    const isOpen = !profileMenu.classList.contains('hidden')
    profileMenu.classList.toggle('hidden', isOpen)
    profileDropdown.classList.toggle('open', !isOpen)
  })

  document.addEventListener('click', () => {
    profileMenu.classList.add('hidden')
    profileDropdown.classList.remove('open')
  })

  // --- INICIO ---
  async function init() {
    // 1. Verificar que hay sesión activa
    const session = await requireAuth();
    if (!session) return;

    // 2. Cargar el perfil del usuario
    try {
      const profile = await getCurrentProfile();
      if (!profile || !profile.is_active) {
        alert('Tu cuenta está desactivada. Contacta al administrador.');
        await logout();
        return;
      }

      // Mostrar datos del usuario en el header
      document.getElementById('user-name').textContent = profile.full_name;
      document.getElementById('user-role').textContent = textoRol(profile.role);
      document.getElementById('user-avatar').textContent = obtenerIniciales(profile.full_name);

      // Guardar el perfil en window para que los módulos puedan usarlo
      window.currentProfile = profile;

      // Generar el menú según el rol
      generarMenu(profile.role);

      // Iniciar el router (carga la sección según el hash de la URL)
      initRouter();

      // Activar el temporizador de inactividad
      startActivityListeners();

    } catch (err) {
      console.error('Error cargando el perfil:', err);
      alert('Ocurrió un error al cargar tu perfil. Por favor, recarga la página.');
    }
  }

  // --- MENÚ HAMBURGUESA (móvil) ---
  const sidebar  = document.getElementById('sidebar');
  const overlay  = document.getElementById('sidebar-overlay');
  const hamburger = document.getElementById('hamburger-btn');

  hamburger.addEventListener('click', () => {
    sidebar.classList.add('open');
    overlay.classList.add('active');
  });

  overlay.addEventListener('click', () => {
    sidebar.classList.remove('open');
    overlay.classList.remove('active');
  });

  // Cerrar sidebar al hacer clic en un ítem del menú (en móvil)
  document.getElementById('sidebar-nav').addEventListener('click', () => {
    sidebar.classList.remove('open');
    overlay.classList.remove('active');
  });

  // Arrancar
  init();
</script>


<div id="toast-container" style="position:fixed;bottom:24px;left:24px;z-index:9999;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none;"></div>

</body>
</html>
