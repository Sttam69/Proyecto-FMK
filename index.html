<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FMK – Inicio de Sesión</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>

<body>

  <div class="login-page">
    <div class="login-card">

      <!-- Logo y nombre del sistema -->
      <div class="login-logo">
        <img src="/escudo-fmk.png" alt="Escudo Oficial FMK" class="logo-img-login" />
        <h1>Federación Madrileña de Karate</h1>
        <p>F.M.K</p>
      </div>

      <h2>Iniciar sesión</h2>

      <!-- Mensaje de error (se muestra si el login falla) -->
      <div id="error-msg" class="alert alert-error" style="display:none;"></div>
      <!-- Mensaje de éxito (para recuperación de contraseña) -->
      <div id="success-msg" class="alert alert-success" style="display:none;"></div>

      <!-- Formulario de login -->
      <form id="login-form">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="Ingresa tu correo" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required
            autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="login-btn">
          Iniciar sesión
        </button>
      </form>

      <!-- Enlace para recuperar contraseña -->
      <div style="text-align:center; margin-top:16px;">
        <button type="button" id="forgot-btn"
          style="background:none; border:none; color:#2563eb; font-size:13px; cursor:pointer; text-decoration:underline;">
          ¿Olvidaste tu contraseña?
        </button>
      </div>

      <!-- Formulario de recuperación (oculto por defecto) -->
      <div id="forgot-section" style="display:none; margin-top:20px; border-top:1px solid #e5e7eb; padding-top:20px;">
        <p style="font-size:13px; color:#6b7280; margin-bottom:12px;">
          Escribe tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
        </p>
        <div class="form-group">
          <label for="reset-email">Correo electrónico</label>
          <input type="email" id="reset-email" placeholder="tu@correo.com" />
        </div>
        <button type="button" class="btn btn-secondary btn-full" id="reset-btn">
          Enviar enlace
        </button>
        <button type="button" id="cancel-reset-btn"
          style="background:none; border:none; color:#6b7280; font-size:13px; cursor:pointer; margin-top:8px; width:100%; text-align:center;">
          Cancelar
        </button>
      </div>

      <p style="text-align:center; font-size:12px; color:#9ca3af; margin-top:24px;">
        Sistema de acceso restringido. Solo usuarios autorizados o usuarios con cuentas dadas por la administración.
      </p>

    </div>
  </div>

  <script type="module">
    import { login, sendPasswordReset, getSession } from '/src/auth.js';

    // Si ya hay una sesión activa, redirigir al dashboard
    getSession().then(session => {
      if (session) window.location.href = '/dashboard.html';
    });

    // Referencias a elementos del DOM
    const loginForm = document.getElementById('login-form');
    const loginBtn = document.getElementById('login-btn');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    const forgotBtn = document.getElementById('forgot-btn');
    const forgotSection = document.getElementById('forgot-section');
    const resetBtn = document.getElementById('reset-btn');
    const cancelResetBtn = document.getElementById('cancel-reset-btn');

    // Mostrar/ocultar mensajes
    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'flex';
      successMsg.style.display = 'none';
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.style.display = 'flex';
      errorMsg.style.display = 'none';
    }

    function hideMessages() {
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
    }

    // --- ENVIAR FORMULARIO DE LOGIN ---
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Iniciando sesión...';

      try {
        await login(email, password);
        window.location.href = '/dashboard.html';
      } catch (err) {
        let msg = 'Correo o contraseña incorrectos. Por favor, comprueba tus datos.';
        if (err.message && err.message.includes('Invalid login')) {
          msg = 'Correo o contraseña incorrectos.';
        } else if (err.message && err.message.includes('Email not confirmed')) {
          msg = 'Tu cuenta no está confirmada. Revisa tu correo.';
        }
        showError(msg);
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Iniciar sesión';
      }
    });

    // --- MOSTRAR SECCIÓN DE RECUPERACIÓN ---
    forgotBtn.addEventListener('click', () => {
      forgotSection.style.display = 'block';
      forgotBtn.style.display = 'none';
      hideMessages();
    });

    cancelResetBtn.addEventListener('click', () => {
      forgotSection.style.display = 'none';
      forgotBtn.style.display = 'block';
      hideMessages();
    });

    // --- ENVIAR ENLACE DE RECUPERACIÓN ---
    resetBtn.addEventListener('click', async () => {
      const email = document.getElementById('reset-email').value.trim();
      if (!email) {
        showError('Por favor, escribe tu correo electrónico.');
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'Enviando...';

      try {
        await sendPasswordReset(email);
        showSuccess('¡Enlace enviado! Revisa tu bandeja de entrada (y la carpeta de spam).');
        forgotSection.style.display = 'none';
        forgotBtn.style.display = 'block';
      } catch (err) {
        showError('No se pudo enviar el enlace. Comprueba que el correo es correcto.');
      } finally {
        resetBtn.disabled = false;
        resetBtn.textContent = 'Enviar enlace';
      }
    });
  </script>

</body>

</html>
